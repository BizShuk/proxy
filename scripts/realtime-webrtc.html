<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proxy Realtime Voice Client</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f1ecdf;
      --ink: #171814;
      --muted: #626459;
      --line: rgba(23, 24, 20, 0.18);
      --panel: rgba(255, 253, 247, 0.82);
      --signal: #d84a2f;
      --live: #167052;
      --warning: #9d6418;
      --shadow: 0 22px 70px rgba(45, 37, 22, 0.12);
      --display: "Avenir Next Condensed", "DIN Alternate", "Franklin Gothic Condensed", sans-serif;
      --body: "Avenir Next", "Gill Sans", sans-serif;
      --mono: "SFMono-Regular", Menlo, Monaco, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: var(--body);
      background:
        radial-gradient(circle at 82% 12%, rgba(216, 74, 47, 0.15), transparent 30rem),
        linear-gradient(rgba(23, 24, 20, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 24, 20, 0.045) 1px, transparent 1px),
        var(--paper);
      background-size: auto, 32px 32px, 32px 32px, auto;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 24px;
      padding: 18px 0 26px;
      border-bottom: 2px solid var(--ink);
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--signal);
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-family: var(--display);
      font-size: clamp(3rem, 8vw, 7.4rem);
      font-stretch: condensed;
      font-weight: 800;
      letter-spacing: -0.055em;
      line-height: 0.82;
      text-transform: uppercase;
    }

    .transport {
      min-width: 180px;
      padding: 12px 14px;
      border: 1px solid var(--ink);
      background: var(--panel);
      font-family: var(--mono);
      font-size: 0.75rem;
      line-height: 1.55;
      text-align: right;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(290px, 0.78fr) minmax(0, 1.55fr);
      gap: 18px;
      padding-top: 18px;
    }

    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 54px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      margin: 0;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .configuration {
      padding: 18px 16px 20px;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 16px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 10px;
    }

    label {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 0;
      outline: none;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.62);
      transition: border-color 150ms ease, background 150ms ease;
    }

    input,
    select {
      min-height: 42px;
      padding: 8px 10px;
    }

    textarea {
      min-height: 114px;
      padding: 10px;
      resize: vertical;
      line-height: 1.5;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--signal);
      background: #fffdf8;
    }

    .security-note {
      margin: 4px 0 18px;
      padding-left: 10px;
      border-left: 3px solid var(--warning);
      color: var(--muted);
      font-size: 0.79rem;
      line-height: 1.5;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .button {
      min-height: 44px;
      border: 1px solid var(--ink);
      color: var(--ink);
      background: transparent;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: transform 120ms ease, color 120ms ease, background 120ms ease;
    }

    .button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.38;
    }

    .button-primary {
      color: #fffaf1;
      background: var(--ink);
    }

    .button-danger {
      color: var(--signal);
      border-color: var(--signal);
    }

    .stage {
      display: grid;
      grid-template-rows: auto minmax(240px, 1fr) minmax(180px, 0.72fr);
      min-height: 650px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 0 rgba(22, 112, 82, 0);
    }

    .status[data-phase="connecting"] .status-dot {
      background: var(--warning);
      animation: pulse 1.1s ease-in-out infinite;
    }

    .status[data-phase="live"] .status-dot {
      background: var(--live);
      animation: live-pulse 1.9s ease-out infinite;
    }

    .status[data-phase="error"] .status-dot {
      background: var(--signal);
    }

    .transcript-wrap {
      display: grid;
      align-content: end;
      overflow: hidden;
      padding: clamp(22px, 4vw, 52px);
      border-bottom: 1px solid var(--line);
    }

    .transcript-label {
      margin-bottom: 16px;
      color: var(--signal);
      font-family: var(--mono);
      font-size: 0.69rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .transcript {
      max-height: 330px;
      margin: 0;
      overflow: auto;
      white-space: pre-wrap;
      color: var(--ink);
      font-family: var(--display);
      font-size: clamp(1.8rem, 4.2vw, 4.2rem);
      font-weight: 650;
      letter-spacing: -0.035em;
      line-height: 1.02;
    }

    .transcript:empty::before {
      content: "連線後直接說話。模型回應的逐字稿會出現在這裡。";
      color: rgba(23, 24, 20, 0.32);
    }

    .event-console {
      min-height: 0;
      overflow: auto;
      padding: 14px 16px;
      color: #d8e4d3;
      background: #1c211c;
      font-family: var(--mono);
      font-size: 0.7rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .event-console:empty::before {
      content: "等待 Realtime events...";
      color: #7f897b;
    }

    .utility {
      border: 0;
      color: var(--muted);
      background: transparent;
      font-family: var(--mono);
      font-size: 0.66rem;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    audio {
      display: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    @keyframes live-pulse {
      0% { box-shadow: 0 0 0 0 rgba(22, 112, 82, 0.42); }
      70% { box-shadow: 0 0 0 12px rgba(22, 112, 82, 0); }
      100% { box-shadow: 0 0 0 0 rgba(22, 112, 82, 0); }
    }

    @media (max-width: 820px) {
      .shell {
        width: min(100% - 20px, 620px);
        padding-top: 10px;
      }

      .masthead {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .transport {
        width: 100%;
        text-align: left;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 570px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">OpenAI-compatible / WebRTC field client</p>
        <h1>Live Voice<br>Through Proxy</h1>
      </div>
      <div class="transport">
        MEDIA / WebRTC<br>
        EVENTS / oai-events<br>
        AUTH / Proxy key
      </div>
    </header>

    <section class="workspace">
      <aside class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Session configuration</h2>
        </div>
        <form id="session-form" class="configuration">
          <div class="field">
            <label for="proxy-url">Proxy URL</label>
            <input id="proxy-url" name="proxy-url" type="url" value="http://localhost:8317" required>
          </div>

          <div class="field">
            <label for="proxy-key">Proxy API key</label>
            <input id="proxy-key" name="proxy-key" type="password" autocomplete="off" placeholder="sk-..." required>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="model">Model</label>
              <input id="model" name="model" value="gpt-realtime-2.1" required>
            </div>
            <div class="field">
              <label for="voice">Voice</label>
              <select id="voice" name="voice">
                <option value="marin">marin</option>
                <option value="cedar">cedar</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="instructions">Instructions</label>
            <textarea id="instructions" name="instructions">請使用繁體中文，回答簡潔自然。如果聽不清楚，先請使用者重說，不要自行猜測。</textarea>
          </div>

          <p class="security-note">
            API key 不會寫入 localStorage。請只在 localhost 使用此 sample，並使用 proxy key，不要貼入 OpenAI upstream key。
          </p>

          <div class="controls">
            <button id="connect" class="button button-primary" type="submit">Connect</button>
            <button id="mute" class="button" type="button" disabled>Mute</button>
            <button id="disconnect" class="button button-danger" type="button" disabled>Disconnect</button>
            <button id="clear" class="button" type="button">Clear log</button>
          </div>
        </form>
      </aside>

      <section class="panel stage">
        <div class="panel-header">
          <div id="status" class="status" data-phase="ready" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-label">Ready</span>
          </div>
          <button id="clear-transcript" class="utility" type="button">clear transcript</button>
        </div>

        <div class="transcript-wrap">
          <div class="transcript-label">Live transcript</div>
          <pre id="transcript" class="transcript" aria-live="polite"></pre>
        </div>

        <pre id="event-console" class="event-console" aria-label="Realtime event log"></pre>
      </section>
    </section>

    <audio id="remote-audio" autoplay></audio>
  </main>

  <script>
    "use strict";

    const MAX_EVENT_LINES = 120;
    const form = document.querySelector("#session-form");
    const proxyURLInput = document.querySelector("#proxy-url");
    const proxyKeyInput = document.querySelector("#proxy-key");
    const modelInput = document.querySelector("#model");
    const voiceInput = document.querySelector("#voice");
    const instructionsInput = document.querySelector("#instructions");
    const connectButton = document.querySelector("#connect");
    const muteButton = document.querySelector("#mute");
    const disconnectButton = document.querySelector("#disconnect");
    const clearButton = document.querySelector("#clear");
    const clearTranscriptButton = document.querySelector("#clear-transcript");
    const status = document.querySelector("#status");
    const statusLabel = document.querySelector("#status-label");
    const transcript = document.querySelector("#transcript");
    const eventConsole = document.querySelector("#event-console");
    const remoteAudio = document.querySelector("#remote-audio");

    let peerConnection = null;
    let dataChannel = null;
    let localStream = null;
    let muted = false;
    let eventLines = [];

    function setPhase(phase, label) {
      status.dataset.phase = phase;
      statusLabel.textContent = label;
    }

    function setControls(connected, connecting = false) {
      connectButton.disabled = connected || connecting;
      disconnectButton.disabled = !connected && !connecting;
      muteButton.disabled = !connected;
      proxyURLInput.disabled = connected || connecting;
      proxyKeyInput.disabled = connected || connecting;
      modelInput.disabled = connected || connecting;
      voiceInput.disabled = connected || connecting;
      instructionsInput.disabled = connected || connecting;
    }

    function addEvent(direction, event) {
      const summary = summarizeEvent(event);
      const timestamp = new Date().toLocaleTimeString("en-GB", { hour12: false });
      eventLines.push(`${timestamp} ${direction} ${JSON.stringify(summary)}`);
      if (eventLines.length > MAX_EVENT_LINES) {
        eventLines = eventLines.slice(-MAX_EVENT_LINES);
      }
      eventConsole.textContent = eventLines.join("\n");
      eventConsole.scrollTop = eventConsole.scrollHeight;
    }

    function summarizeEvent(event) {
      if (!event || typeof event !== "object") {
        return event;
      }
      const summary = { ...event };
      if (typeof summary.delta === "string" && summary.type === "response.output_audio.delta") {
        summary.delta = `[base64 audio: ${summary.delta.length} chars]`;
      }
      if (typeof summary.audio === "string") {
        summary.audio = `[base64 audio: ${summary.audio.length} chars]`;
      }
      return summary;
    }

    function appendTranscript(text, prefix = "") {
      if (!text) {
        return;
      }
      transcript.textContent += prefix + text;
      transcript.scrollTop = transcript.scrollHeight;
    }

    function handleServerEvent(event) {
      addEvent("<-", event);
      switch (event.type) {
      case "response.output_audio_transcript.delta":
      case "response.output_text.delta":
        appendTranscript(event.delta || "");
        break;
      case "response.output_audio_transcript.done":
      case "response.output_text.done":
        if (!transcript.textContent.endsWith("\n")) {
          appendTranscript("\n");
        }
        break;
      case "conversation.item.input_audio_transcription.completed":
        appendTranscript(event.transcript || "", "\n你：");
        appendTranscript("\n模型：");
        break;
      case "error":
        setPhase("error", event.error?.message || "Realtime error");
        break;
      }
    }

    function configureDataChannel(channel) {
      channel.addEventListener("open", () => {
        setPhase("live", "Live / speak now");
        setControls(true);
      });
      channel.addEventListener("message", (message) => {
        try {
          handleServerEvent(JSON.parse(message.data));
        } catch (error) {
          addEvent("<-", { type: "invalid_json", message: error.message });
        }
      });
      channel.addEventListener("close", () => {
        if (peerConnection) {
          setPhase("ready", "Data channel closed");
        }
      });
      channel.addEventListener("error", () => {
        setPhase("error", "Data channel error");
      });
    }

    async function connect() {
      const proxyURL = proxyURLInput.value.trim().replace(/\/+$/, "");
      const proxyKey = proxyKeyInput.value.trim();
      const model = modelInput.value.trim();
      const voice = voiceInput.value;
      const instructions = instructionsInput.value.trim();

      if (!proxyURL || !proxyKey || !model) {
        throw new Error("Proxy URL、proxy API key 與 model 都是必填");
      }

      setPhase("connecting", "Requesting microphone");
      setControls(false, true);

      localStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
      });

      peerConnection = new RTCPeerConnection();
      peerConnection.addEventListener("track", (event) => {
        remoteAudio.srcObject = event.streams[0];
        remoteAudio.play().catch(() => {
          setPhase("error", "Browser blocked audio playback");
        });
      });
      peerConnection.addEventListener("connectionstatechange", () => {
        addEvent("..", {
          type: "peer.connection_state",
          state: peerConnection?.connectionState,
        });
        if (peerConnection?.connectionState === "failed") {
          setPhase("error", "Peer connection failed");
        }
      });

      for (const track of localStream.getAudioTracks()) {
        peerConnection.addTrack(track, localStream);
      }

      dataChannel = peerConnection.createDataChannel("oai-events");
      configureDataChannel(dataChannel);

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      const session = {
        type: "realtime",
        model,
        output_modalities: ["audio"],
        audio: {
          input: {
            turn_detection: {
              type: "server_vad",
            },
          },
          output: {
            voice,
          },
        },
      };
      if (instructions) {
        session.instructions = instructions;
      }

      const requestBody = new FormData();
      requestBody.set("sdp", offer.sdp);
      requestBody.set("session", JSON.stringify(session));

      setPhase("connecting", "Creating Realtime session");
      const response = await fetch(`${proxyURL}/v1/realtime/calls`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${proxyKey}`,
        },
        body: requestBody,
      });

      const answerSDP = await response.text();
      if (!response.ok) {
        throw new Error(`Proxy ${response.status}: ${answerSDP.slice(0, 400)}`);
      }

      await peerConnection.setRemoteDescription({
        type: "answer",
        sdp: answerSDP,
      });
      addEvent("->", {
        type: "peer.session_created",
        model,
        voice,
      });
    }

    function disconnect(label = "Disconnected") {
      dataChannel?.close();
      dataChannel = null;

      peerConnection?.close();
      peerConnection = null;

      for (const track of localStream?.getTracks() || []) {
        track.stop();
      }
      localStream = null;
      remoteAudio.srcObject = null;
      muted = false;
      muteButton.textContent = "Mute";
      setControls(false);
      setPhase("ready", label);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        disconnect("Preparing session");
        await connect();
      } catch (error) {
        addEvent("!!", { type: "client.error", message: error.message });
        disconnect(error.message);
        setPhase("error", error.message);
      }
    });

    muteButton.addEventListener("click", () => {
      muted = !muted;
      for (const track of localStream?.getAudioTracks() || []) {
        track.enabled = !muted;
      }
      muteButton.textContent = muted ? "Unmute" : "Mute";
      setPhase("live", muted ? "Muted" : "Live / speak now");
    });

    disconnectButton.addEventListener("click", () => {
      disconnect();
    });

    clearButton.addEventListener("click", () => {
      eventLines = [];
      eventConsole.textContent = "";
    });

    clearTranscriptButton.addEventListener("click", () => {
      transcript.textContent = "";
    });

    window.addEventListener("beforeunload", () => {
      disconnect();
    });

    setControls(false);
  </script>
</body>
</html>
